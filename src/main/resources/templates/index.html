<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sảnh Chờ - Chess Pro</title>

    <script>
        (function () {
            try {
                var theme = localStorage.getItem("chess_theme") || "dark";
                document.documentElement.setAttribute("data-theme", theme);
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .lobby-header-clean {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
            border-radius: 0;
        }

        .lobby-title-clean {
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: normal;
        }

        .lobby-actions-right {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .form-reset {
            margin: 0;
        }

        .room-grid-clean {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }

        .room-card-clean {
            position: relative;
            border-radius: 0;
            padding: 18px;
            background: var(--bg-card);
            border: 1px solid rgba(76, 175, 80, 0.25);
        }

        .room-status-badge {
            position: absolute;
            top: 18px;
            right: 18px;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 8px;
            border: 1px solid;
            letter-spacing: 1px;
        }

        .room-status-waiting {
            color: var(--primary);
            border-color: var(--primary);
        }

        .room-status-playing {
            color: var(--danger);
            border-color: var(--danger);
        }

        .room-info-clean {
            margin-bottom: 15px;
        }

        .room-label {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .room-host-name {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .room-mode {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }

        .room-mode-value {
            color: var(--text-soft);
        }

        .btn-join-clean {
            width: 100%;
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 0;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-join-clean:hover {
            background-color: var(--primary);
            color: #ffffff;
        }

        .room-playing-disabled {
            width: 100%;
            background-color: var(--bg-soft);
            color: var(--text-muted);
            border: 1px solid var(--border-strong);
            border-radius: 0;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            box-sizing: border-box;
            cursor: not-allowed;
        }

        .empty-room-message {
            color: var(--text-muted);
            padding: 40px 20px;
            text-align: center;
            background: var(--bg-soft);
            border-radius: 0;
            grid-column: 1 / -1;
            border: 1px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 13px;
        }

        .leaderboard-panel-clean {
            height: fit-content;
            border-radius: 0;
        }

        .leaderboard-title-clean {
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: normal;
            font-size: 15px;
        }

        .ranking-item-clean {
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 5px;
            border-radius: 0;
        }

        .ranking-name-clean {
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 900px) {
            .lobby-header-clean {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .lobby-actions-right {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="lobby-content">
    <div class="lobby-main">
        <div class="lobby-actions lobby-header-clean">
            <h3 class="lobby-title-clean">DANH SÁCH PHÒNG CHỜ</h3>

            <div class="lobby-actions-right">
                <button type="button" onclick="showBotModal()" class="btn-create-room-bot">
                    🤖 Đấu với máy
                </button>

                <form id="create-room-form" th:action="@{/game/create}" method="post" class="form-reset">
                    <button type="button"
                            onclick="clearBotMode(); document.getElementById('create-room-form').submit();"
                            class="btn-create-room-pvp">
                        TẠO PHÒNG MỚI
                    </button>
                </form>

                <form id="create-bot-form" th:action="@{/game/create-bot}" method="post" style="display: none;"></form>
            </div>
        </div>

        <div class="room-grid room-grid-clean">
            <div class="room-card room-card-clean" th:each="game : ${waitingGames}">
                <div class="room-status-badge"
                     th:classappend="${game.status.name() == 'WAITING'} ? ' room-status-waiting' : ' room-status-playing'"
                     th:text="${game.status.name() == 'WAITING' ? '1/2' : '2/2'}">
                </div>

                <div class="room-info room-info-clean">
                    <div class="room-label">CHỦ PHÒNG</div>

                    <div class="room-host-name">
                        <span th:text="${game.whitePlayer != null ? game.whitePlayer.username : game.blackPlayer.username}">
                            USERNAME
                        </span>
                    </div>

                    <div class="room-mode">
                        CHẾ ĐỘ:
                        <span class="room-mode-value" th:text="${game.gameMode}">PLAYER_VS_PLAYER</span>
                    </div>
                </div>

                <form th:if="${game.status.name() == 'WAITING'}"
                      th:action="@{/game/join}"
                      method="post"
                      class="form-reset">
                    <input type="hidden" name="gameId" th:value="${game.id}">
                    <button type="submit" onclick="clearBotMode()" class="btn-join-clean">
                        VÀO CHƠI
                    </button>
                </form>

                <div th:if="${game.status.name() == 'IN_PROGRESS'}" class="room-playing-disabled">
                    ĐANG CHƠI
                </div>
            </div>

            <div th:if="${#lists.isEmpty(waitingGames)}" class="empty-room-message">
                Chưa có phòng nào. Hãy là người đầu tiên tạo phòng.
            </div>
        </div>
    </div>

    <aside class="leaderboard-panel leaderboard-panel-clean">
        <h3 class="leaderboard-title-clean">BẢNG XẾP HẠNG</h3>
        <ul class="ranking-list">
            <li class="ranking-item ranking-item-clean" th:each="player, iterStat : ${topPlayers}">
                <span class="rank" th:text="${iterStat.count}">1</span>
                <span class="name ranking-name-clean" th:text="${player.username}">USER</span>
                <span class="elo" th:text="${player.eloRating}">1200</span>
            </li>
        </ul>
    </aside>
</main>

<div class="bot-modal-overlay" id="bot-modal-overlay">
    <div class="bot-modal">
        <h3>ĐẤU VỚI MÁY</h3>
        <p>CHỌN ĐỘ KHÓ</p>
        <div class="bot-modal-buttons">
            <button type="button" onclick="playWithBot(6)" class="btn-bot-diff">DỄ</button>
            <button type="button" onclick="playWithBot(10)" class="btn-bot-diff">TRUNG BÌNH</button>
            <button type="button" onclick="playWithBot(15)" class="btn-bot-diff">KHÓ</button>
        </div>
        <button type="button" onclick="closeBotModal()" class="btn-close-modal">Quay lại sảnh</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script>
    function showBotModal() {
        document.getElementById('bot-modal-overlay').classList.add('show');
    }

    function closeBotModal() {
        document.getElementById('bot-modal-overlay').classList.remove('show');
    }

    function playWithBot(depth) {
        sessionStorage.setItem("isBotMode", "true");
        sessionStorage.setItem("botDepth", depth);
        document.getElementById("create-bot-form").submit();
    }

    function clearBotMode() {
        sessionStorage.removeItem("isBotMode");
        sessionStorage.removeItem("botDepth");
    }
</script>

<script th:inline="javascript">
    /*<![CDATA[*/
    var currentUsername = /*[[${session.currentPlayer != null ? session.currentPlayer.username : 'guest'}]]*/ 'guest';
    currentUsername = String(currentUsername).trim();
    /*]]>*/

    document.addEventListener("DOMContentLoaded", function () {
        var socket = new SockJS('/ws');
        var stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, function () {
            stompClient.subscribe('/topic/lobby', function (message) {
                const payload = message.body;

                if (
                    payload.startsWith("ROOM_CREATED:") ||
                    payload.startsWith("ROOM_CANCELLED:") ||
                    payload.startsWith("RELOAD_LOBBY:")
                ) {
                    const actorName = payload.split(":")[1].trim();
                    if (actorName !== currentUsername) {
                        window.location.reload();
                    }
                }
            });
        }, function (error) {
            console.error("Lỗi kết nối WebSocket:", error);
        });
    });
</script>

<script th:src="@{/js/theme.js}"></script>
</body>
</html>
