<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hồ sơ - Chess Pro</title>

    <script>
        (function () {
            try {
                var theme = localStorage.getItem("chess_theme") || "dark";
                document.documentElement.setAttribute("data-theme", theme);
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="profile-container">
    <div class="profile-header">
        <div class="profile-avatar"
             th:text="${#strings.substring(currentPlayer.username,0,1).toUpperCase()}">G</div>

        <div class="profile-username"
             th:text="${currentPlayer.username}">Tên người dùng</div>

        <div class="profile-rank">
            Hạng:
            <span class="rank-name"
                  th:text="${currentPlayer.eloRating >= 1500 ? 'Cao thủ' : 'Tân binh'}">Tân binh</span>
        </div>
    </div>

    <div class="profile-stats">
        <div class="profile-stat-item">
            <div class="profile-stat-value" th:text="${totalWins}">0</div>
            <div class="profile-stat-label">Thắng</div>
        </div>

        <div class="profile-stat-item">
            <div class="profile-stat-value" th:text="${totalLosses}">0</div>
            <div class="profile-stat-label">Thua</div>
        </div>

        <div class="profile-stat-item">
            <div class="profile-stat-value" th:text="${currentPlayer.eloRating}">1200</div>
            <div class="profile-stat-label">ELO</div>
        </div>
    </div>

    <div class="history-section">
        <div class="history-title">Lịch sử ván đấu</div>

        <div style="overflow-x: auto;">
            <table class="history-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Bắt đầu</th>
                    <th>Kết thúc</th>
                    <th>Đối thủ</th>
                    <th>Kết quả</th>
                    <th>Elo</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="game : ${gameHistory.content}">
                    <td th:text="${#strings.substring(game.gameId, 0, 8)} + '...'">ID</td>
                    <td th:text="${#temporals.format(game.startedAt, 'dd/MM HH:mm')}">Start</td>
                    <td th:text="${#temporals.format(game.finishedAt, 'dd/MM HH:mm')}">End</td>
                    <td th:text="${game.opponentName}">Opponent</td>

                    <td>
                        <span th:text="${game.result}"
                              th:classappend="${game.result == 'Thắng'} ? 'result-win' :
                                              (${game.result == 'Thua'} ? 'result-loss' : 'result-draw')">
                            Result
                        </span>
                    </td>

                    <td>
                        <span th:text="${(game.eloChange >= 0 ? '+' : '') + game.eloChange}"
                              th:classappend="${game.eloChange >= 0} ? 'elo-plus' : 'elo-minus'">
                            Elo
                        </span>
                    </td>

                    <td>
                        <a th:href="@{/game/replay/{id}(id=${game.gameId})}" class="replay-btn">D.lại</a>
                    </td>
                </tr>

                <tr th:if="${gameHistory.isEmpty()}">
                    <td colspan="7">Chưa có ván đấu nào</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${gameHistory.totalPages > 1}"
             style="margin-top: 1.5rem; display: flex; justify-content: center; align-items: center; gap: 15px;">
            <a th:if="${gameHistory.hasPrevious()}"
               th:href="@{/profile(page=${gameHistory.number - 1})}"
               class="replay-btn">&larr; Trước</a>

            <span th:text="${gameHistory.number + 1} + ' / ' + ${gameHistory.totalPages}">1 / 1</span>

            <a th:if="${gameHistory.hasNext()}"
               th:href="@{/profile(page=${gameHistory.number + 1})}"
               class="replay-btn">Sau &rarr;</a>
        </div>
    </div>

    <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 12px; align-items: center;">
    
    <a th:href="@{/logout}"
       class="save-settings-btn"
       style="width: 220px; text-align: center;">
        Đăng xuất
    </a>

    <a th:href="@{/}"
       class="replay-btn"
       style="width: 220px; text-align: center;">
        ← Quay lại bàn cờ
    </a>

</div>
</div>

<script th:src="@{/js/theme.js}"></script>
</body>
</html>
