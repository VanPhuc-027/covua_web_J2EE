<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bàn Cờ - Chess Pro</title>

    <script>
        (function () {
            try {
                var theme = localStorage.getItem("chess_theme") || "dark";
                document.documentElement.setAttribute("data-theme", theme);
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="top-navbar">
    <div class="logo">
        <h2>♟️ Chess Pro</h2>
    </div>

    <ul class="menu-items">
        <li th:if="${game.status.name() == 'WAITING'}">
            <form th:action="@{/game/cancel}" method="post" class="inline-form-reset">
                <input type="hidden" name="gameId" th:value="${game.id}" />
                <button type="submit" class="inline-button-reset">
                    🔙 Hủy phòng &amp; Về sảnh
                </button>
            </form>
        </li>

        <li th:if="${game.status.name() == 'IN_PROGRESS'}">
            <span class="danger-status">🚫 Trận đấu đang diễn ra</span>
        </li>
    </ul>

    <div class="header-right-group">
        <div class="user-profile" th:if="${currentPlayer != null}">
            <div class="info">
                <span class="name" th:text="${currentPlayer.username}">User</span>
                <span class="elo" th:text="${currentPlayer.eloRating} + ' Elo'">1200 Elo</span>
            </div>
            <div class="avatar">👤</div>
        </div>
    </div>
</header>

<main class="main-content">
    <div class="board-container">
        <div th:if="${game.status.name() == 'WAITING'}" class="waiting-overlay">
            <h2 class="waiting-text">⏳ Đang chờ đối thủ...</h2>
        </div>

        <div class="chessboard" id="main-chessboard">
            <div th:each="rowArray : ${board.boxes}" class="row">
                <div th:each="spot : ${rowArray}"
                     class="square"
                     th:classappend="${(spot.row + spot.col) % 2 == 0 ? ' light' : ' dark'}"
                     th:attr="data-row=${spot.row},data-col=${spot.col}">
                    <img th:if="${spot.piece != null}"
                         th:src="@{${spot.piece.iconPath}}"
                         class="chess-piece"
                         alt="piece">
                </div>
            </div>
        </div>
    </div>

    <aside class="right-panel game-layout-panel">
        <div class="game-info panel-fixed">
            <div class="player opponent">
                <div class="avatar">🤖</div>
                <div class="details">
                    <span class="name" th:text="${opponentName}">Đối thủ</span>
                    <span class="time" id="timer-opponent">180s</span>
                </div>
            </div>

            <div class="match-status">
                <span th:text="${game.status}">STATUS</span>
            </div>

            <div class="player you">
                <div class="avatar">👤</div>
                <div class="details">
                    <span class="name" th:text="${currentPlayer.username}">Bạn</span>
                    <span class="time" id="timer-you">180s</span>
                </div>
            </div>
        </div>

        <div class="game-actions" th:if="${game.status.name() != 'WAITING'}">
            <button id="btn-draw" class="action-btn">🤝 Cầu hòa</button>
            <button id="btn-resign" class="action-btn">🏳️ Đầu hàng</button>
        </div>

        <div class="move-history moves-panel">
            <div class="history-header panel-fixed">Lịch sử nước đi</div>
            <div class="moves-list moves-scroll"></div>
        </div>

        <div class="chat-box chat-panel">
            <div class="chat-header panel-fixed">Trò chuyện</div>
            <div class="chat-messages chat-scroll" id="chat-messages">
                <div class="message system system-message">
                    Chào mừng bạn đến với bàn cờ!
                </div>
            </div>
            <div class="chat-input panel-fixed">
                <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." autocomplete="off">
                <button id="btn-send-chat">Gửi</button>
            </div>
        </div>
    </aside>
</main>

<div id="promotion-modal-overlay" class="bot-modal-overlay">
    <div class="bot-modal">
        <h3>Chọn quân phong cấp</h3>
        <div class="bot-modal-buttons">
            <button class="promo-btn btn-bot-diff" data-piece="queen">
                <img id="promo-img-queen" src="" alt="Queen" class="promo-icon"> Hậu
            </button>
            <button class="promo-btn btn-bot-diff" data-piece="rook">
                <img id="promo-img-rook" src="" alt="Rook" class="promo-icon"> Xe
            </button>
            <button class="promo-btn btn-bot-diff" data-piece="bishop">
                <img id="promo-img-bishop" src="" alt="Bishop" class="promo-icon"> Tượng
            </button>
            <button class="promo-btn btn-bot-diff" data-piece="knight">
                <img id="promo-img-knight" src="" alt="Knight" class="promo-icon"> Mã
            </button>
        </div>
    </div>
</div>

<div id="game-modal-overlay" class="bot-modal-overlay">
    <div class="bot-modal">
        <div id="game-modal-icon" class="modal-icon">🔔</div>
        <h3 id="game-modal-title">Thông báo</h3>
        <p id="game-modal-message">Nội dung thông báo</p>
        <div class="bot-modal-buttons">
            <button id="game-modal-btn-confirm" class="btn-bot-diff">Đồng ý</button>
            <button id="game-modal-btn-cancel" class="btn-bot-diff">Hủy</button>
            <button id="game-modal-btn-ok" class="btn-bot-diff">OK</button>
        </div>
    </div>
</div>

<audio id="move-sound" th:src="@{/sounds/move.mp3}" preload="auto"></audio>
<audio id="capture-sound" th:src="@{/sounds/capture.mp3}" preload="auto"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script th:inline="javascript">
    window.CHESS_CONFIG = {
        gameId: /*[[${game.id}]]*/ 'default',
        username: /*[[${currentPlayer.username}]]*/ 'guest',
        isSound: localStorage.getItem('chess_sound') !== 'false',
        isHints: localStorage.getItem('chess_hints') !== 'false',
        isFocus: localStorage.getItem('chess_focus') === 'true'
    };

    window.CURRENT_GAME_ID = /*[[${game.id}]]*/ 'default';
    window.CURRENT_USERNAME = /*[[${currentPlayer.username}]]*/ 'guest';
    window.WHITE_PLAYER = /*[[${game.whitePlayer != null ? game.whitePlayer.username : ''}]]*/ '';
    window.BLACK_PLAYER = /*[[${game.blackPlayer != null ? game.blackPlayer.username : ''}]]*/ '';

    if (window.CHESS_CONFIG.isFocus) {
        document.body.classList.add('focus-mode');
    }

    window.playSound = function (type) {
        if (!window.CHESS_CONFIG.isSound) return;

        const sound = document.getElementById(type === 'capture' ? 'capture-sound' : 'move-sound');
        if (sound) {
            sound.play().catch(function () {});
        }
    };
</script>

<script th:src="@{/js/socket.js}"></script>
<script th:src="@{/js/game.js}"></script>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
