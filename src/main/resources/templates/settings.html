<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cài đặt - Chess Pro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>
    (function () {
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme === "light") {
            document.documentElement.classList.add("light-mode-preload");
        }
    })();
</script>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="lobby-content admin-content">
    <div class="settings-box">

        <div class="settings-header">
            <h3>CÀI ĐẶT HỆ THỐNG</h3>
        </div>

        <div class="setting-item">
            <div>
                <span class="setting-label">Âm thanh ván cờ</span>
                <span class="setting-desc">Phát tiếng khi di chuyển hoặc ăn quân</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="toggleSound">
                <span class="slider"></span>
            </label>
        </div>

        <div class="setting-item">
            <div>
                <span class="setting-label">Hiển thị gợi ý</span>
                <span class="setting-desc">Đánh dấu các ô hợp lệ khi bấm vào quân cờ</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="toggleHints">
                <span class="slider"></span>
            </label>
        </div>

        <div class="setting-item">
            <div class="setting-label">
                Chế độ giao diện
                <span class="setting-desc">Chuyển giữa giao diện sáng và tối</span>
            </div>

            <select id="themeSelect" class="theme-select">
                <option value="dark">Tối</option>
                <option value="light">Sáng</option>
            </select>
        </div>

        <button type="button" class="save-settings-btn">
            <span>Lưu cài đặt</span>
        </button>

    </div>
</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const toggleSound = document.getElementById("toggleSound");
    const toggleHints = document.getElementById("toggleHints");
    const toggleFocus = document.getElementById("toggleFocus");
    const saveBtn = document.getElementById("saveSettingsBtn");

    if (toggleSound) {
        toggleSound.checked = localStorage.getItem("chess_sound") !== "false";
    }

    if (toggleHints) {
        toggleHints.checked = localStorage.getItem("chess_hints") !== "false";
    }

    if (toggleFocus) {
        toggleFocus.checked = localStorage.getItem("chess_focus") === "true";
    }

    function saveSettings() {
        const soundEnabled = toggleSound ? toggleSound.checked : true;
        const hintsEnabled = toggleHints ? toggleHints.checked : true;
        const focusEnabled = toggleFocus ? toggleFocus.checked : false;

        localStorage.setItem("chess_sound", soundEnabled);
        localStorage.setItem("chess_hints", hintsEnabled);
        localStorage.setItem("chess_focus", focusEnabled);

        if (focusEnabled) {
            document.body.classList.add("focus-mode-active");
        } else {
            document.body.classList.remove("focus-mode-active");
        }

        if (soundEnabled) {
            const testAudio = new Audio("/sounds/move-self.mp3");
            testAudio.play().catch(function () {
                console.warn("Không phát được âm thanh test.");
            });
        }

        if (saveBtn) {
            const originalText = saveBtn.innerText;
            const originalBg = saveBtn.style.backgroundColor;

            saveBtn.innerText = "ĐÃ LƯU ✓";
            saveBtn.style.backgroundColor = "#45a049";

            setTimeout(function () {
                saveBtn.innerText = originalText;
                saveBtn.style.backgroundColor = originalBg;
            }, 1500);
        }
    }

    if (saveBtn) {
        saveBtn.addEventListener("click", saveSettings);
    }

    window.saveSettings = saveSettings;
});
document.addEventListener("DOMContentLoaded", function () {
    const toggleSound = document.getElementById("toggleSound");
    const toggleHints = document.getElementById("toggleHints");
    const toggleFocus = document.getElementById("toggleFocus");
    const saveBtn = document.getElementById("saveSettingsBtn");

    if (toggleSound) {
        toggleSound.checked = localStorage.getItem("chess_sound") !== "false";
    }

    if (toggleHints) {
        toggleHints.checked = localStorage.getItem("chess_hints") !== "false";
    }

    if (toggleFocus) {
        toggleFocus.checked = localStorage.getItem("chess_focus") === "true";
    }

    if (saveBtn) {
        saveBtn.addEventListener("click", function () {
            localStorage.setItem("chess_sound", toggleSound ? toggleSound.checked : true);
            localStorage.setItem("chess_hints", toggleHints ? toggleHints.checked : true);
            localStorage.setItem("chess_focus", toggleFocus ? toggleFocus.checked : false);

            alert("Đã lưu cài đặt thành công!");

            if (toggleFocus && toggleFocus.checked) {
                document.body.classList.add("focus-mode-active");
            } else {
                document.body.classList.remove("focus-mode-active");
            }
        });
    }
});
</script>
<script th:src="@{/js/settings.js}"></script>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
