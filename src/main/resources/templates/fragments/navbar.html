<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="navbar" class="fragments-navbar">
    <header class="top-navbar fixed-navbar">

        <div class="logo">
            <a th:href="@{/}" class="navbar-logo-link">
                <h2>
                    <span class="logo-icon">♟️</span>
                    <span class="logo-text">CHESS PRO</span>
                </h2>
            </a>
        </div>

        <ul class="menu-items fixed-menu">
            <li>
                <a th:href="@{/}">Sảnh</a>
            </li>
            <li>
                <a th:href="@{/settings}">Cài đặt</a>
            </li>
            <li>
                <a th:href="@{/guide}">Hướng dẫn chơi</a>
            </li>
        </ul>

        <div class="header-right-group header-right-group-compact">

            <div class="auth-buttons" th:if="${session.currentPlayer == null}">
                <a th:href="@{/login}" class="btn-login navbar-login-btn">Đăng nhập</a>
            </div>

            <a th:href="@{/admin/users}"
               th:if="${session.currentPlayer != null and session.currentPlayer.role == 'ROLE_ADMIN'}"
               class="btn-admin-compact"
               title="Quản trị viên">
                <span class="admin-icon">⚙️</span>
                <span class="admin-text">ADMIN</span>
            </a>

            <a th:href="@{/profile}"
               th:if="${session.currentPlayer != null}"
               class="user-profile profile-compact navbar-profile-link">
                <div class="info">
                    <span class="name" th:text="${session.currentPlayer.username}">USER</span>
                    <span class="elo" th:text="${session.currentPlayer.eloRating} + ' ELO'">1200 ELO</span>
                </div>
                <div class="avatar">👤</div>
            </a>

        </div>
    </header>
</div>
</body>
</html>
